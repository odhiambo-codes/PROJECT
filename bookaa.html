<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Palace Hotel System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}
body{
    background: linear-gradient(135deg,#d16ba5,#86a8e7,#5ffbf1);
    min-height:100vh;
}
h1{text-align:center;color:#fff;margin:20px;}

.form{
    background:#fff;
    max-width:500px;
    margin:20px auto;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    transition: 0.3s;
}
.form:hover{
    transform:translateY(-20px)
}

label{display:block;margin-top:10px;}
input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    background:#ff4b2b;
    color:#fff;
    border-radius:10px;
    cursor:pointer;
}

/* POPUP */
#popup{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
}

#box{
    background:#fff;
    padding:20px;
    width:90%;
    max-width:400px;
    border-radius:15px;
}

.popup-btns button{
    margin-top:10px;
}

/* MPESA POPUP */
#mpesaPopup{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
}

#mpesaBox{
    background:#fff;
    padding:20px;
    width:90%;
    max-width:350px;
    border-radius:15px;
}
</style>
</head>

<body>

<h1>SKY PALACE HOTEL</h1>

<div class="form">

<label>Name</label>
<input id="name">

<label>Email</label>
<input id="email">

<label>Phone</label>
<input id="phone">

<p>Standard Rooms</p>
<select id="room1" onchange="selectRoom('room1',this)">
<option value="0">None</option>
<option value="3000">A1-001</option>
<option value="3000">A1-002</option>
<option value="3000">A1-003</option>
<option value="3000">A1-004</option>
<option value="3000">A1-005</option>
<option value="3000">A2-001</option>
<option value="3000">A2-002</option>
<option value="3000">A2-003</option>
<option value="3000">A2-004</option>
<option value="3000">A2-005</option>
</select>

<p>Deluxe Rooms</p>
<select id="room2" onchange="selectRoom('room2',this)">
<option value="0">None</option>
<option value="6000">B1-001</option>
<option value="6000">B1-002</option>
<option value="6000">B1-003</option>
<option value="6000">B1-004</option>
<option value="6000">B1-005</option>
<option value="6000">B2-001</option>
<option value="6000">B2-002</option>
<option value="6000">B2-003</option>
<option value="6000">B2-004</option>
<option value="6000">B2-005</option>
</select>

<p>Executive Rooms</p>
<select id="room3" onchange="selectRoom('room3',this)">
<option value="0">None</option>
<option value="10000">E1-001</option>
<option value="10000">E1-002</option>
<option value="10000">E1-003</option>
<option value="10000">E1-004</option>
<option value="10000">E1-005</option>
<option value="10000">E2-001</option>
<option value="10000">E2-002</option>
<option value="10000">E2-003</option>
<option value="10000">E2-004</option>
<option value="10000">E2-005</option>
</select>

<label>Days</label>
<select id="days">
<option value="">Select days</option>
<option value="1">1 Day</option>
<option value="2">2 Days</option>
<option value="3">3 Days</option>
<option value="4">4 Days</option>
<option value="5">5 Days</option>
<option value="6">6 Days</option>
<option value="7">1 Week</option>
</select>

<button onclick="book()">Book Now</button>

</div>

<!-- CONFIRM POPUP -->
<div id="popup">
<div id="box">
<h3>Confirm Booking</h3>
<div id="info"></div>

<div class="popup-btns">
<button onclick="confirmBooking()">Confirm</button>
<button onclick="closePopup()">Cancel</button>
</div>
</div>
</div>

<!-- MPESA POPUP -->
<div id="mpesaPopup">
<div id="mpesaBox">
<h3>M-Pesa Payment</h3>
<p id="mpesaInfo"></p>

<button onclick="payMpesa()">Pay Now</button>
<button onclick="closeMpesa()">Cancel</button>
</div>
</div>

<script>

let selectedRoom = null;
let booking = null;


// 🛏 SELECT ROOM (FIXED)
function selectRoom(roomType, element){

    // if "None" selected
    if(element.value == "0"){
        selectedRoom = null;
        return;
    }

    // reset ONLY the other dropdowns
    if(roomType !== "room1") document.getElementById("room1").value = "0";
    if(roomType !== "room2") document.getElementById("room2").value = "0";
    if(roomType !== "room3") document.getElementById("room3").value = "0";

    // save selected room
    selectedRoom = {
        roomName: element.options[element.selectedIndex].text,
        price: Number(element.value)
    };
}


// 📦 BOOK
function book(){

    if(selectedRoom == null){
        alert("Please select a room");
        return;
    }

    let name = document.getElementById("name").value;
    let days = document.getElementById("days").value;

    if(days == ""){
        alert("Please select number of days");
        return;
    }

    let totalCost = selectedRoom.price * Number(days);

    booking = {
        customerName: name,
        room: selectedRoom.roomName,
        days: days,
        total: totalCost
    };

    document.getElementById("info").innerHTML =
        "Name: " + booking.customerName + "<br>" +
        "Room: " + booking.room + "<br>" +
        "Days: " + booking.days + "<br>" +
        "Total: KES " + booking.total;

    document.getElementById("popup").style.display = "flex";
}


// ❌ CLOSE BOOKING POPUP
function closePopup(){
    document.getElementById("popup").style.display = "none";
}


// ✅ CONFIRM → MPESA
function confirmBooking(){

    document.getElementById("popup").style.display = "none";

    document.getElementById("mpesaInfo").innerHTML =
        "Pay KES " + booking.total + " for Room " + booking.room;

    document.getElementById("mpesaPopup").style.display = "flex";
}


// ❌ CLOSE MPESA
function closeMpesa(){
    document.getElementById("mpesaPopup").style.display = "none";
}


// 💳 PAY (SIMULATION)
function payMpesa(){
    alert("M-Pesa payment request sent (Demo)");
    document.getElementById("mpesaPopup").style.display = "none";
}

</script>

</body>
</html>
